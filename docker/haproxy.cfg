global
    maxconn 1024
    tune.bufsize 8192
    tune.maxrewrite 1024

defaults
    mode http
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout queue 10s
    # Enable HTTP keep-alive connection pooling
    option http-keep-alive
    maxconn 1024

frontend http_front
    bind *:9999
    default_backend http_back

backend http_back
    balance roundrobin
    # Configure backends with active health checks and connection limits
    server api1 api1:8080 check maxconn 512
    server api2 api2:8080 check maxconn 512
