global
    maxconn 40000

defaults
    mode http
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    timeout queue 5s
    # Enable HTTP keep-alive connection pooling
    option http-keep-alive
    maxconn 40000

frontend http_front
    bind *:9999
    default_backend http_back

backend http_back
    balance roundrobin
    # Configure backends with active health checks and connection limits
    server api1 api1:8080 check maxconn 20000
    server api2 api2:8080 check maxconn 20000
