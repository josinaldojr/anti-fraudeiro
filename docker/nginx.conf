worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    keepalive_timeout 65s;
    keepalive_requests 10000;

    upstream anti_fraudeiro_api {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        keepalive 128;
    }

    server {
        listen 9999;
        server_name _;

        location / {
            proxy_pass http://anti_fraudeiro_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            
            # Reduce overhead
            proxy_request_buffering off;
        }

        location /ready {
            proxy_pass http://anti_fraudeiro_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
