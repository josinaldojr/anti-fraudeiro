services:
  nginx:
    image: nginx:1.29-alpine
    platform: linux/amd64
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    cpus: 0.10
    mem_limit: 20m
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 20M
    networks:
      - anti-fraudeiro

  api1:
    image: ghcr.io/josinaldojr/anti-fraudeiro:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      PORT: "8080"
    cpus: 0.45
    mem_limit: 165m
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 165M
    networks:
      - anti-fraudeiro

  api2:
    image: ghcr.io/josinaldojr/anti-fraudeiro:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      PORT: "8080"
    cpus: 0.45
    mem_limit: 165m
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 165M
    networks:
      - anti-fraudeiro

networks:
  anti-fraudeiro:
    driver: bridge

