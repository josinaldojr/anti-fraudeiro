services:
  haproxy:
    image: haproxy:3.0-alpine
    platform: linux/amd64
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - ./docker/haproxy.cfg:/etc/haproxy/haproxy.cfg:ro
    cpus: 0.20
    mem_limit: 20m
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 20M
    networks:
      - anti-fraudeiro

  api1:
    image: ghcr.io/josinaldojr/anti-fraudeiro:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      GOMAXPROCS: "${GOMAXPROCS:-1}"
      GC_PERCENT: "${GC_PERCENT:-500}"
      MEMORY_LIMIT_MIB: "${MEMORY_LIMIT_MIB:-0}"
      MAX_CONCURRENT_FRAUD_REQUESTS: "${MAX_CONCURRENT_FRAUD_REQUESTS:-0}"
      BUCKET_TARGET_CANDIDATES: "${BUCKET_TARGET_CANDIDATES:-256}"
      BUCKET_MAX_SEARCH_RADIUS: "${BUCKET_MAX_SEARCH_RADIUS:-3}"
    cpus: 0.40
    mem_limit: 165m
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 165M
    networks:
      - anti-fraudeiro

  api2:
    image: ghcr.io/josinaldojr/anti-fraudeiro:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      GOMAXPROCS: "${GOMAXPROCS:-1}"
      GC_PERCENT: "${GC_PERCENT:-500}"
      MEMORY_LIMIT_MIB: "${MEMORY_LIMIT_MIB:-0}"
      MAX_CONCURRENT_FRAUD_REQUESTS: "${MAX_CONCURRENT_FRAUD_REQUESTS:-0}"
      BUCKET_TARGET_CANDIDATES: "${BUCKET_TARGET_CANDIDATES:-256}"
      BUCKET_MAX_SEARCH_RADIUS: "${BUCKET_MAX_SEARCH_RADIUS:-3}"
    cpus: 0.40
    mem_limit: 165m
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 165M
    networks:
      - anti-fraudeiro

networks:
  anti-fraudeiro:
    driver: bridge
